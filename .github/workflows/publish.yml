name: Publish verified platform build

on:
  workflow_call:
    inputs:
      artifact:
        required: true
        type: string
      tag:
        required: true
        type: string
      filename:
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ inputs.artifact }}
          path: release
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          files: release/${{ inputs.filename }}
          fail_on_unmatched_files: true
          overwrite_files: true
