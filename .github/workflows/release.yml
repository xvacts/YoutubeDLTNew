name: Build YoutubeDLT

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read

jobs:

############################
# Windows
############################

  windows:

    runs-on: windows-latest

    steps:

    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false

    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --require-hashes --only-binary=:all: -r requirements-build-windows.lock

    - name: Security regression tests
      env:
        QT_QPA_PLATFORM: offscreen
      run: python -m unittest discover -s tests -v

    - name: Build Windows
      shell: cmd
      run: |
        set "PATH=%pythonLocation%;%pythonLocation%\Scripts;%SystemRoot%\System32;%SystemRoot%"
        pyinstaller --noconfirm --clean --onefile --windowed ^
        --name YoutubeDLT ^
        --collect-all PyQt6 ^
        --hidden-import PyQt6.QtCore ^
        --hidden-import PyQt6.QtGui ^
        --hidden-import PyQt6.QtWidgets ^
        --exclude-module yt_dlp ^
        --hidden-import certifi ^
        main.py

    - name: Package
      run: |
        mkdir release
        move dist\YoutubeDLT.exe release\YoutubeDLT-Windows.exe

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: windows-release
        path: release/YoutubeDLT-Windows.exe
        if-no-files-found: error
        retention-days: 3

############################
# macOS ARM (M1/M2/M3)
############################

  mac-arm:

    runs-on: macos-latest

    steps:

    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false

    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.12"

    - name: Install deps
      run: |
        python -m pip install -r requirements-build.txt

    - name: Security regression tests
      env:
        QT_QPA_PLATFORM: offscreen
      run: python -m unittest discover -s tests -v

    - name: Build ARM
      run: |
        pyinstaller \
        --noconfirm \
        --clean \
        --windowed \
        --target-arch arm64 \
        --name YoutubeDLT \
        --collect-all PyQt6 \
        --hidden-import PyQt6.QtCore \
        --hidden-import PyQt6.QtGui \
        --hidden-import PyQt6.QtWidgets \
        --exclude-module yt_dlp \
        --hidden-import certifi \
        main.py

    - name: Fix macOS security
      run: |
        xattr -cr dist/YoutubeDLT.app
        codesign --deep --force --sign - dist/YoutubeDLT.app

    - name: Zip
      run: |
        cd dist
        zip -r YoutubeDLT-macOS-arm64.zip YoutubeDLT.app

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: mac-arm-release
        path: dist/YoutubeDLT-macOS-arm64.zip
        if-no-files-found: error
        retention-days: 3

############################
# macOS Intel
############################

  mac-intel:

    runs-on: macos-15-intel

    steps:

    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false

    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.12"

    - name: Force Intel Python
      run: |
        pip install --upgrade pip
        python -m pip install -r requirements-build.txt

    - name: Security regression tests
      env:
        QT_QPA_PLATFORM: offscreen
      run: python -m unittest discover -s tests -v

    - name: Build Intel
      run: |
        pyinstaller \
        --noconfirm \
        --clean \
        --windowed \
        --target-arch x86_64 \
        --name YoutubeDLT \
        --collect-all PyQt6 \
        --hidden-import PyQt6.QtCore \
        --hidden-import PyQt6.QtGui \
        --hidden-import PyQt6.QtWidgets \
        --exclude-module yt_dlp \
        --hidden-import certifi \
        main.py

    - name: Fix macOS security
      run: |
        xattr -cr dist/YoutubeDLT.app
        codesign --deep --force --sign - dist/YoutubeDLT.app

    - name: Zip
      run: |
        cd dist
        zip -r YoutubeDLT-macOS-x86_64.zip YoutubeDLT.app

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: mac-intel-release
        path: dist/YoutubeDLT-macOS-x86_64.zip
        if-no-files-found: error
        retention-days: 3

  publish-windows:
    needs: windows
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/publish.yml
    with:
      artifact: windows-release
      tag: windows
      filename: YoutubeDLT-Windows.exe

  publish-mac-arm:
    needs: mac-arm
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/publish.yml
    with:
      artifact: mac-arm-release
      tag: mac-arm
      filename: YoutubeDLT-macOS-arm64.zip

  publish-mac-intel:
    needs: mac-intel
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/publish.yml
    with:
      artifact: mac-intel-release
      tag: mac-intel
      filename: YoutubeDLT-macOS-x86_64.zip
